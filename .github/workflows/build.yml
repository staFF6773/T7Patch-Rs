name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows x64 Release build
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Release distribution
        run: '& .\scripts\build.ps1'

      - name: Build smoke-test executables
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --examples

      - name: Check DLL loading and original exports
        timeout-minutes: 2
        run: |
          & ".\target\x86_64-pc-windows-msvc\release\examples\smoke.exe" ".\dist\t7patch.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check remote loading in a dedicated test process
        timeout-minutes: 2
        run: |
          & ".\target\x86_64-pc-windows-msvc\release\examples\loader_smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # This mode disables game detection and settings writes. No desktop screenshot is needed.
      - name: Check launcher window lifecycle
        timeout-minutes: 2
        run: |
          $executable = Join-Path $env:GITHUB_WORKSPACE 'dist\t7patch.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--ui-smoke-test' -PassThru
          try {
              if (-not $process.WaitForExit(30000)) {
                  $process.Kill()
                  throw 'Launcher UI smoke test timed out.'
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                  throw "Launcher UI smoke test failed: $($process.ExitCode)"
              }
          } finally {
              $process.Dispose()
          }

      - name: Upload verified Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: t7patch-windows-x64
          path: |
            dist/t7patch.exe
            dist/t7patch.dll
          if-no-files-found: error
          retention-days: 14

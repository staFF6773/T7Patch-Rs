[package]
name = "t7patch"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "t7patch-launcher"
path = "src/bin/t7patch.rs"

[dependencies]
minhook-sys = "=0.1.1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader", "Win32_System_Memory",
    "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_System_Kernel", "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell",
    "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_Networking_WinHttp",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
